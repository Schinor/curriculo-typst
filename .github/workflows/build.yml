name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  # Mesma versão do README e do devcontainer.
  TYPST_VERSION: "0.15.1"

jobs:
  protecao:
    name: Proteção contra dados pessoais
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checar extensões e pastas
        run: bash scripts/pre-commit --todos

  build:
    name: Compilar exemplos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ env.TYPST_VERSION }}

      - name: Compilar (pt)
        run: ./scripts/build.sh exemplos/dados.yaml out pt

      - name: Compilar (en)
        run: ./scripts/build.sh exemplos/dados.yaml out en

      - name: Checar texto extraível
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          for secao in RESUMO "EXPERIÊNCIA PROFISSIONAL" PROJETOS HABILIDADES; do
            pdftotext out/full-cycle.pdf - | grep -q "$secao" || { echo "seção ausente: $secao"; exit 1; }
          done

      - uses: actions/upload-artifact@v7
        with:
          name: pdfs-exemplo
          path: out/*.pdf

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [protecao, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pdfs-exemplo
          path: out

      - uses: softprops/action-gh-release@v3
        with:
          files: out/*.pdf
          generate_release_notes: true
