# yaml-language-server: $schema=../schema/curriculo.schema.json
#
# Dados de EXEMPLO de uma pessoa fictícia. Nenhuma informação aqui é real.
# Este arquivo preenche todos os campos do esquema (inclusive os opcionais)
# para servir de documentação viva e de teste visual do template.
#
# Regras rápidas:
#   - item de lista SEM `tags` aparece em todos os perfis;
#   - item COM `tags` aparece nos perfis que compartilham ao menos uma tag;
#   - campos com sufixo `_en` são usados quando idioma=en (fallback: campo sem sufixo);
#   - datas no formato "AAAA-MM" (entre aspas); `fim` aceita também `atual`.

pessoal:
  nome: Ana Exemplo
  titulo_padrao: Profissional de Dados
  titulo_padrao_en: Data Professional
  email: ana@exemplo.com
  telefone: "+55 11 90000-0000"
  cidade: São Paulo/SP
  cidade_en: São Paulo, Brazil
  linkedin: linkedin.com/in/ana-exemplo
  github: github.com/ana-exemplo
  site: ana-exemplo.dev
  foto: exemplos/foto-exemplo.png

resumos:
  padrao: >-
    Profissional de dados com experiência de ponta a ponta: da coleta e modelagem
    à entrega de modelos e painéis usados no dia a dia de times de negócio.
  padrao_en: >-
    Data professional with end-to-end experience, from collection and modeling to
    shipping models and dashboards used daily by business teams.
  cientista-dados: >-
    Cientista de dados focada em modelos preditivos e experimentação. Gosto de
    transformar perguntas vagas em hipóteses testáveis e de medir o impacto real
    do que vai para produção.
  cientista-dados_en: >-
    Data scientist focused on predictive models and experimentation. I enjoy turning
    vague questions into testable hypotheses and measuring the real impact of what
    reaches production.
  data-engineer: >-
    Engenheira de dados com foco em pipelines confiáveis, observáveis e baratos de
    operar, em nuvem e com infraestrutura como código.
  data-engineer_en: >-
    Data engineer focused on reliable, observable and cost-efficient pipelines, in
    the cloud and with infrastructure as code.
  analista-dados: >-
    Analista de dados que traduz métricas em decisões: definição de indicadores,
    painéis self-service e análises ad hoc para diretoria e produto.
  analista-dados_en: >-
    Data analyst who turns metrics into decisions: KPI definition, self-service
    dashboards and ad hoc analyses for leadership and product.

